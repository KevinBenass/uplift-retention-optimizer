data:
  dataset: x5                 # x5 | hillstrom | synthetic
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_clients: 60000    # only used when dataset = synthetic
  split: {train: 0.6, valid: 0.2, test: 0.2}
  seed: 42

# Campaign economics, per dataset (in that dataset's currency). These drive every
# targeting decision, so they are explicit, versioned, and stress-tested in the
# sensitivity analysis.
#   gross_margin     margin on incremental revenue
#   contact_cost     cost per message sent
#   discount_value   cost of the offer, paid by every treated customer who redeems it,
#                    including those who would have bought anyway ("sure things")
#   redemption_rate  share of treated purchasers who actually redeem
economics:
  x5:         # X5 Retail Group, Russian grocery chain; amounts in RUB
    gross_margin: 0.22
    contact_cost: 2.5
    discount_value: 15.0
    redemption_rate: 0.5
  hillstrom:  # US apparel e-mail campaign; amounts in USD
    gross_margin: 0.35
    contact_cost: 0.05
    discount_value: 5.0
    redemption_rate: 0.8
  synthetic:  # simulator calibrated to X5 orders of magnitude
    gross_margin: 0.22
    contact_cost: 2.5
    discount_value: 15.0
    redemption_rate: 0.5

models:
  # Meta-learners all share the same LightGBM base learner so differences come from
  # the causal strategy, not from model capacity.
  learners: [s_learner, t_learner, x_learner, dr_learner, transformed_outcome]
  lgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbose: -1

evaluation:
  budget_fraction: 0.30       # the campaign can contact at most 30% of the base
  bootstrap: 500
  n_bins: 10
  results_dir: results
  artifacts_dir: artifacts
