name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra serve
      - run: uv run ruff check .
      # Tests run the whole pipeline (DuckDB features -> models -> policy -> report)
      # on simulated data in the X5 schema.
      - run: uv run pytest --cov=uplift_optimizer --cov-report=term-missing
