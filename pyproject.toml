[project]
name = "uplift-retention-optimizer"
version = "0.1.0"
description = "Who should get the retention offer? Uplift modeling and budget-constrained targeting, evaluated in dollars on randomized data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Benassuly" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
uplift = "uplift_optimizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
